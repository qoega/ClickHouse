# Insert the content of this file into ~/.odbc.ini or /etc/odbc.ini files.

[ODBC Data Sources]
ClickHouse DSN (ANSI)    = ClickHouse ODBC Driver (ANSI)
MySQL ODBC 8.0 ANSI      = MySQL ODBC 8.0 ANSI Driver

[MySQL ODBC 8.0 ANSI]
Description = My Sql
Driver = MySQL ODBC 8.0 ANSI Driver
SERVER = localhost
UID = root
PWD = password
Port = 3306
DATABASE = slt

[ClickHouse DSN (ANSI)]
Driver      = ClickHouse ODBC Driver (ANSI)
Description = DSN (localhost) for ClickHouse ODBC Driver (ANSI)
Server = localhost
UID = default
USER = default
Database = slt

### Old way:
Port = 8123
Proto = http

# Timeout for http queries to ClickHouse server (default is 30 seconds)
# Timeout=60
